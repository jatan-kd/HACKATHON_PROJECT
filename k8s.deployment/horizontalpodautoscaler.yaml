apiVersion: autoscaling/v2beta1
kind: HorizontalPodAutoscaler
metadata:
  name: #{AppName}-hpa
  namespace: #{Namespace}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: #{AppName}-deployment
  minReplicas: #{MinReplicas}
  maxReplicas: #{MaxReplicas}
  metrics:
  - type: Resource
    resource:
      name: cpu
      targetAverageUtilization: #{CPUUtilizationPercent}
  - type: Resource
    resource:
      name: memory
      targetAverageUtilization: #{MemoryUtilizationPercent}      
